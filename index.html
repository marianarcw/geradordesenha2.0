<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">

        <h1>🔐 Gerador de Senhas</h1>

        <!-- IMAGEM (FUNCIONA SEM ARQUIVO LOCAL) -->
        <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/Lock.svg" alt="cadeado" class="img">

        <div class="senha-box">
            <input id="senha" type="text" readonly>
        </div>

        <div class="controle">

            <button id="menos">-</button>

            <span id="valor">12</span>

            <button id="mais">+</button>

        </div>

        <button id="gerar">Gerar senha</button>

    </div>

    <script src="script.js"></script>

</body>

</html>
